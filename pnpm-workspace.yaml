packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@swc/core": true
  esbuild: true
  exifreader: true
  lefthook: true
  # BullMQ's optional native msgpack; the JavaScript fallback is enough.
  msgpackr-extract: false
  msw: true
  sharp: true
minimumReleaseAgeExclude:
  - "@filipebraida/eslint-config-adonis@0.6.2"
  - "@jrmc/adonis-attachment@6.0.0-beta.7"
