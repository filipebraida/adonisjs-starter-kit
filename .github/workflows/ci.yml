name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the repository; nothing it runs may write back.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + lint + test + coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare env
        working-directory: apps/web
        run: |
          cp .env.example .env
          node ace generate:key --force

      # .adonisjs/ is committed: fail when the codegen would change it.
      - name: Generated files in sync
        run: |
          pnpm ace codegen
          git diff --exit-code -- apps/web/.adonisjs
          test -z "$(git status --porcelain -- apps/web/.adonisjs)"

      # schema.ts is committed: fail when the one generated from a database
      # migrated from scratch differs.
      - name: Migrations from scratch match the committed schema
        run: |
          pnpm ace migration:run --force
          git diff --exit-code -- apps/web/app/core/database/schema.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The typecheck holds each story to its page's props; the build also
      # compiles the MDX rule pages, which no typecheck reads.
      - name: Storybook builds
        run: pnpm --filter storybook-app build

      # A stray async handle (an upload's variant, an open socket) can keep the
      # runner alive after the last spec; the timeout turns a hang into a failure.
      - name: Test + coverage
        working-directory: apps/web
        run: timeout -k 10 900 pnpm coverage

      - name: Coverage summary
        if: success()
        working-directory: apps/web
        run: |
          {
            echo '## Coverage'
            echo '```'
            pnpm exec c8 report --reporter=text-summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
